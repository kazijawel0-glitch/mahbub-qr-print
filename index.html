<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahbub QR Print</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><h1>Mahbub <span>QR Print</span></h1><p>আপনার QR কোড ও প্রিন্ট অর্ডার সহজেই দিন</p></header><main><h2>QR Print Order</h2><p>নিচের ফর্মটি পূরণ করুন।</p><form id="orderForm"><label>আপনার নাম<input name="customer_name" required maxlength="100"></label><label>মোবাইল নম্বর<input name="phone" required maxlength="30" placeholder="01XXXXXXXXX"></label><label>কী প্রিন্ট করবেন?<select name="print_type" required><option value="">নির্বাচন করুন</option><option>QR Code</option><option>স্টিকার</option><option>কার্ড</option><option>অন্যান্য</option></select></label><label>কত কপি<input name="quantity" type="number" min="1" value="1" required></label><label>বিস্তারিত / QR লিংক<textarea name="details" rows="4"></textarea></label><label>ফাইল (ঐচ্ছিক)<input name="file" type="file" accept="image/*,.pdf"></label><button type="submit" id="submitBtn">অর্ডার পাঠান</button><p id="status"></p></form><p>অর্ডার দেওয়ার পর দোকান থেকে যোগাযোগ করা হবে।</p></main><footer>© Mahbub QR Print</footer><script src="config.js"></script><script src="app.js"></script></body></html>
